# docker compose up  -> Postgres, API, background worker and console.
# TEST_MODE defaults to 1 so the simulator can drive /test/clock; set TEST_MODE=0 for a real run.
x-backend: &backend
  build: ./backend
  environment: &backend-env
    POSTGRES_HOST: db
    POSTGRES_DB: fieldnet
    POSTGRES_USER: fieldnet
    POSTGRES_PASSWORD: fieldnet
    TEST_MODE: ${TEST_MODE:-1}
    DJANGO_DEBUG: "0"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fieldnet
      POSTGRES_USER: fieldnet
      POSTGRES_PASSWORD: fieldnet
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnet -d fieldnet"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
